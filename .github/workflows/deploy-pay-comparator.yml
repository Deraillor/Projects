name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'airline-pay-comparator/**'
      - 'camping-planner.html'
      - '.github/workflows/deploy-pay-comparator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site artifact
        run: |
          mkdir -p _site
          cp -r airline-pay-comparator/* _site/
          cp camping-planner.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
